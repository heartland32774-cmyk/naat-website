<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Forgot Password | Naat Website</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>body { background-color: #f4f6f9; }</style>
</head>
<body class="d-flex align-items-center justify-content-center" style="min-height: 100vh;">
    <div class="card shadow-sm border-0 p-4" style="width: 400px; border-radius: 15px;">
        <h4 class="fw-bold text-center mb-3" style="color: #1e7d5a;">Forgot Password</h4>
        <p class="text-muted text-center small mb-4">Enter your registered email address. We will send an OTP.</p>

        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-danger p-2 small fw-bold text-center">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="mb-4">
                <label class="form-label fw-bold small">Email Address</label>
                <input type="email" name="email" class="form-control" required placeholder="example@gmail.com">
            </div>
            <button type="submit" class="btn btn-success w-100 fw-bold">Send OTP</button>
        </form>
        <p class="text-center mt-3 mb-0 small"><a href="{% url 'login' %}" class="text-muted text-decoration-none">Back to Login</a></p>
    </div>
</body>
</html>
