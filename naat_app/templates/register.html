{% extends 'base.html' %}
{% block title %}Register | Naat Website{% endblock %}

{% block content %}
<div class="d-flex align-items-center justify-content-center" style="min-height: calc(100vh - 80px); padding: 20px;">
    <div class="card shadow-sm border-0 p-4" style="width: 400px; border-radius: 15px;">
        <h3 class="fw-bold text-center mb-4" style="color: #1e7d5a;">Create Account</h3>
        
        <!-- Error/Flash Messages -->
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-danger p-2 small fw-bold text-center">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label fw-bold small">Username</label>
                <input type="text" name="username" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label fw-bold small">Email Address</label>
                <input type="email" name="email" class="form-control" required placeholder="example@gmail.com">
            </div>
            <div class="mb-4">
                <label class="form-label fw-bold small">Password</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-success w-100 fw-bold">Register</button>
        </form>
        
        <p class="text-center mt-3 mb-0 small text-muted">Already have an account? <a href="{% url 'login' %}" style="color: #1e7d5a;">Login here</a></p>
    </div>
</div>
{% endblock %}
