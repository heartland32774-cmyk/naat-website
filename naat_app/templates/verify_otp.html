<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Verify OTP | Naat Website</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>body { background-color: #f4f6f9; }</style>
</head>
<body class="d-flex align-items-center justify-content-center" style="min-height: 100vh;">
    <div class="card shadow-sm border-0 p-4" style="width: 400px; border-radius: 15px;">
        <h4 class="fw-bold text-center mb-3" style="color: #1e7d5a;">Enter OTP</h4>
        <p class="text-muted text-center small mb-4">Check your email. Enter the 6-digit OTP below.</p>

        {% if messages %}
            {% for message in messages %}
                {% if message.tags == 'success' %}
                    <div class="alert alert-success p-2 small fw-bold text-center">{{ message }}</div>
                {% else %}
                    <div class="alert alert-danger p-2 small fw-bold text-center">{{ message }}</div>
                {% endif %}
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="mb-4">
                <input type="text" name="otp" class="form-control text-center fw-bold fs-4" maxlength="6" required placeholder="000000" style="letter-spacing: 5px;">
            </div>
            <button type="submit" class="btn btn-success w-100 fw-bold">Verify OTP</button>
        </form>
    </div>
</body>
</html>
