{% extends 'base.html' %}
{% block title %}Change Password | Naat Website{% endblock %}

{% block content %}
<div class="d-flex align-items-center justify-content-center" style="min-height: calc(100vh - 70px);">
    <div class="card shadow-sm border-0 p-4" style="width: 400px; border-radius: 15px;">
        <h4 class="fw-bold text-center mb-4" style="color: #1e7d5a;">Change Password</h4>

        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}success{% endif %} p-2 small fw-bold text-center">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label fw-bold small">Old Password</label>
                <input type="password" name="old_password" class="form-control" required>
            </div>
            <div class="mb-4">
                <label class="form-label fw-bold small">New Password</label>
                <input type="password" name="new_password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-success w-100 fw-bold">Update Password</button>
        </form>
    </div>
</div>
{% endblock %}
