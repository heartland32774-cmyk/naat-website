{% extends 'base.html' %}
{% block title %}Login | Naat Website{% endblock %}

{% block content %}
<div class="d-flex align-items-center justify-content-center" style="min-height: calc(100vh - 80px); padding: 20px;">
    <div class="card shadow-sm border-0 p-4" style="width: 400px; border-radius: 15px;">
        <h3 class="fw-bold text-center mb-4" style="color: #1e7d5a;">Login</h3>
        
        <!-- Error/Flash Messages (Red text) -->
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %} p-2 small fw-bold text-center">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label fw-bold small">Username</label>
                <input type="text" name="username" class="form-control" required>
            </div>
            <div class="mb-4">
                <label class="form-label fw-bold small">Password</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-success w-100 fw-bold">Login</button>
        </form>
        
        <div class="d-flex justify-content-between mt-3">
            <a href="{% url 'register' %}" class="small text-muted text-decoration-none">Create Account</a>
            <div>
                <a href="{% url 'forgot_username' %}" class="small text-primary text-decoration-none me-2">Forgot Username?</a>
                <a href="{% url 'forgot_password' %}" class="small text-danger text-decoration-none">Forgot Password?</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
